# ============================================================
# Base configuration
# ============================================================
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
personality = "pragmatic"

approval_policy = "never"
project_root_markers = [".git"]

# ============================================================
# Default permission
# ============================================================

default_permissions = ":danger-full-access"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
required = true

enabled_tools = [
  "notion-fetch",
  "notion-create-pages",
]

default_tools_approval_mode = "approve"

# ============================================================
# worker-base
# ============================================================

[permissions.worker-base]
description = "worker base config"

[permissions.worker-base.filesystem]
glob_scan_max_depth = 3
":minimal" = "read"

[permissions.worker-base.filesystem.":workspace_roots"]
"." = "read"
"**/*.env" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"

[permissions.worker-base.network]
enabled = false
